<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="사물인지">
<link rel="manifest" href="/manifest.webmanifest">
<title>사물 인지</title>
<style>
  :root { --bg:#111418; --panel:#1b2027; --line:#2c333d; --fg:#e8edf4; --dim:#8b97a6;
          --accent:#4da3ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
              font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",
              "Malgun Gothic","Apple SD Gothic Neo",sans-serif; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; padding-top:env(safe-area-inset-top);
         padding-bottom:env(safe-area-inset-bottom); }

  #stage { position:relative; flex:1; min-height:0; background:#000;
           display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #video { max-width:100%; max-height:100%; display:block; }
  #overlay { position:absolute; pointer-events:none; }

  #hud { position:absolute; top:8px; left:8px; right:8px; display:flex; gap:6px;
         flex-wrap:wrap; pointer-events:none; }
  .chip { background:rgba(0,0,0,.62); border:1px solid var(--line); color:var(--fg);
          border-radius:999px; padding:4px 10px; font-size:12px; font-variant-numeric:tabular-nums; }
  .chip.warn { background:rgba(120,30,30,.85); border-color:#7a3a3a; }

  #bar { display:flex; gap:8px; padding:10px; background:var(--panel);
         border-top:1px solid var(--line); }
  button, select, input[type=text], textarea {
    font:inherit; color:var(--fg); background:#232a33; border:1px solid var(--line);
    border-radius:10px; padding:11px 12px; }
  button { min-height:48px; flex:1; font-weight:600; }
  button:active { background:#2e3743; }
  button.primary { background:var(--accent); color:#06121f; border-color:var(--accent); }
  button.small { min-height:40px; flex:0 0 auto; padding:8px 14px; font-weight:500; }

  #panel { background:var(--panel); border-top:1px solid var(--line);
           padding:12px; display:none; max-height:52vh; overflow:auto; }
  #panel.open { display:block; }
  .row { margin-bottom:14px; }
  .row > label { display:block; color:var(--dim); font-size:13px; margin-bottom:6px; }
  select, input[type=text], textarea { width:100%; }
  textarea { min-height:76px; resize:vertical; }
  input[type=range] { width:100%; height:36px; accent-color:var(--accent); }
  .inline { display:flex; gap:8px; align-items:center; }
  .val { font-variant-numeric:tabular-nums; color:var(--fg); min-width:44px; text-align:right; }
  .hint { color:var(--dim); font-size:12px; margin-top:6px; }

  #list { max-height:22vh; overflow:auto; background:var(--panel);
          border-top:1px solid var(--line); padding:6px 10px; display:none; }
  #list.open { display:block; }
  .item { display:flex; justify-content:space-between; gap:10px; padding:5px 0;
          border-bottom:1px solid var(--line); font-size:14px; }
  .item:last-child { border-bottom:0; }
  .item .sc { color:var(--dim); font-variant-numeric:tabular-nums; }
  .empty { color:var(--dim); padding:8px 0; }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>
  <div id="hud">
    <span class="chip" id="c_state">준비 중…</span>
    <span class="chip" id="c_perf" hidden></span>
    <span class="chip" id="c_model" hidden></span>
  </div>
</div>

<div id="list"></div>

<div id="panel">
  <div class="row">
    <label>검출기</label>
    <select id="f_backend">
      <option value="auto">auto — 빠름 (COCO 80종)</option>
      <option value="yolo">yolo — COCO 80종</option>
      <option value="world">world — 찾을 것을 글자로</option>
      <option value="frcnn">frcnn — 중간</option>
      <option value="frcnn50">frcnn50 — 가장 정확·느림</option>
      <option value="ssdlite">ssdlite</option>
    </select>
  </div>

  <div class="row" id="r_prompt" style="display:none">
    <label>찾을 것 — 영어로, 쉼표로 구분 (door=문 처럼 쓰면 한글로 표시)</label>
    <textarea id="f_prompt"></textarea>
    <div class="inline" style="margin-top:8px">
      <button class="small primary" id="b_prompt">프롬프트 적용</button>
      <span class="hint" id="s_prompt"></span>
    </div>
  </div>

  <div class="row">
    <label>신뢰도 문턱값</label>
    <div class="inline">
      <input type="range" id="f_conf" min="0.05" max="0.9" step="0.05" value="0.35">
      <span class="val" id="v_conf">0.35</span>
    </div>
    <div class="hint">world 는 점수가 낮게 나옵니다. 0.1~0.25 를 권합니다.</div>
  </div>

  <div class="row">
    <label>보내는 크기 — 작을수록 빠르고, 클수록 작은 물체를 잘 찾습니다</label>
    <select id="f_size">
      <option value="480">480 px</option>
      <option value="640" selected>640 px</option>
      <option value="960">960 px</option>
      <option value="1280">1280 px</option>
    </select>
  </div>

  <div class="row">
    <label>이름표</label>
    <select id="f_lang">
      <option value="ko" selected>한글</option>
      <option value="en">영문</option>
    </select>
  </div>
</div>

<div id="bar">
  <button id="b_start" class="primary">시작</button>
  <button id="b_flip">카메라 전환</button>
  <button id="b_list">목록</button>
  <button id="b_panel">설정</button>
</div>

<script>
const $ = s => document.querySelector(s);
const video = $('#video'), overlay = $('#overlay'), octx = overlay.getContext('2d');
const grabCv = document.createElement('canvas'), gctx = grabCv.getContext('2d');

let stream = null, running = false, facing = 'environment';
let conf = 0.35, sendSize = 640, lang = 'ko';
let info = null, lastObjects = [], emaFps = 0;
let lastSrc = { w: 640, h: 480 };   // 마지막 결과의 원본 크기 (다시 그릴 때 쓴다)

const state = t => $('#c_state').textContent = t;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* 클래스마다 항상 같은 색 (파이썬 쪽과 같은 방식) */
function colorFor(name){
  let h = 0;
  for (const ch of name) h = (h * 131 + ch.codePointAt(0)) >>> 0;
  return `hsl(${h % 360} 85% 60%)`;
}

async function loadConfig(){
  try {
    info = await (await fetch('/config')).json();
    $('#f_backend').value = info.kind;
    $('#c_model').hidden = false;
    $('#c_model').textContent = info.name + ' · ' + info.device;
    syncBackendUI();
    if (info.world) $('#f_prompt').value = info.classes.join(', ');
  } catch (e) { state('서버에 연결하지 못했습니다'); }
}

function syncBackendUI(){
  const isWorld = $('#f_backend').value === 'world';
  $('#r_prompt').style.display = isWorld ? '' : 'none';
  if (isWorld && conf > 0.25) setConf(0.15);
  if (!isWorld && conf < 0.25) setConf(0.35);
}

function setConf(v){
  conf = v; $('#f_conf').value = v; $('#v_conf').textContent = v.toFixed(2);
}

async function startCamera(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    state('이 브라우저에서는 카메라를 쓸 수 없습니다 (HTTPS 로 여십시오)');
    return false;
  }
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
  } catch (e) {
    state('카메라를 열지 못했습니다: ' + e.name);
    return false;
  }
  video.srcObject = stream;
  await video.play().catch(() => {});
  return true;
}

function fitOverlay(){
  const r = video.getBoundingClientRect();
  overlay.width = Math.round(r.width); overlay.height = Math.round(r.height);
  overlay.style.width = r.width + 'px'; overlay.style.height = r.height + 'px';
  overlay.style.left = (r.left - video.parentElement.getBoundingClientRect().left) + 'px';
  overlay.style.top = (r.top - video.parentElement.getBoundingClientRect().top) + 'px';
}

/* 프레임 한 장을 JPEG 바이트로.

   canvas.toBlob 대신 동기 toDataURL 을 쓴다. toBlob 은 콜백이 언제 불릴지
   브라우저·상황에 달려 있어서, 어떤 환경에서는 크기와 무관하게 한 장에
   1초씩 걸린다(측정값: 64x64 도 1280x720 도 똑같이 1010 ms). toDataURL 은
   같은 조건에서 640x480 이 2~3 ms 로 일정하다. 인코딩 자체는 원래 싸다. */
function grab(){
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  const s = Math.min(1, sendSize / Math.max(vw, vh));
  grabCv.width = Math.round(vw * s); grabCv.height = Math.round(vh * s);
  gctx.drawImage(video, 0, 0, grabCv.width, grabCv.height);
  const url = grabCv.toDataURL('image/jpeg', 0.6);
  const bin = atob(url.slice(url.indexOf(',') + 1));
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf;
}

function draw(objects, srcW, srcH){
  lastSrc = { w: srcW, h: srcH };
  fitOverlay();
  octx.clearRect(0, 0, overlay.width, overlay.height);
  const sx = overlay.width / srcW, sy = overlay.height / srcH;
  octx.font = '600 15px -apple-system,"Malgun Gothic",sans-serif';
  octx.textBaseline = 'top';
  for (const o of objects){
    const [x1, y1, x2, y2] = o.box;
    const X = x1 * sx, Y = y1 * sy, W = (x2 - x1) * sx, H = (y2 - y1) * sy;
    const col = colorFor(o.label);
    octx.lineWidth = 3; octx.strokeStyle = col;
    octx.strokeRect(X, Y, W, H);

    const txt = (lang === 'ko' ? o.ko : o.label) + ' ' + Math.round(o.score * 100) + '%';
    const tw = octx.measureText(txt).width;
    let ty = Y - 22; if (ty < 0) ty = Y + 2;
    octx.fillStyle = col;
    octx.fillRect(X, ty, tw + 12, 21);
    octx.fillStyle = '#08121c';
    octx.fillText(txt, X + 6, ty + 3);
  }
}

function renderList(objects){
  const el = $('#list');
  if (!objects.length){ el.innerHTML = '<div class="empty">찾은 물체가 없습니다.</div>'; return; }
  el.innerHTML = objects.map(o =>
    `<div class="item"><span>${lang === 'ko' ? o.ko : o.label}</span>` +
    `<span class="sc">${Math.round(o.score * 100)}%</span></div>`).join('');
}

async function loop(){
  let fail = 0;
  while (running){
    const t0 = performance.now();
    const buf = grab();
    if (!buf){ await sleep(60); continue; }
    try {
      const r = await fetch('/detect', {
        method: 'POST', body: buf,
        headers: { 'Content-Type': 'image/jpeg', 'X-Conf': String(conf) }
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      fail = 0;
      lastObjects = j.objects;
      draw(j.objects, j.w, j.h);
      if ($('#list').classList.contains('open')) renderList(j.objects);

      const dt = performance.now() - t0;
      emaFps = emaFps ? emaFps * 0.8 + (1000 / dt) * 0.2 : 1000 / dt;
      $('#c_perf').hidden = false;
      $('#c_perf').textContent =
        `${emaFps.toFixed(1)} fps · 추론 ${j.ms} ms · ${j.objects.length}개`;
      state('실행 중');
      $('#c_state').className = 'chip';
    } catch (e) {
      fail++;
      $('#c_state').className = 'chip warn';
      state('연결 문제 (' + e.message + ')');
      await sleep(Math.min(2000, 300 * fail));
    }
  }
}

/* ---- 조작 ---- */
$('#b_start').onclick = async () => {
  if (running){
    running = false;
    $('#b_start').textContent = '시작'; $('#b_start').classList.add('primary');
    state('멈춤');
    return;
  }
  state('카메라 여는 중…');
  if (!await startCamera()) return;
  running = true;
  $('#b_start').textContent = '정지'; $('#b_start').classList.remove('primary');
  loop();
};

$('#b_flip').onclick = async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  if (stream) await startCamera();
};

$('#b_list').onclick = () => {
  $('#list').classList.toggle('open');
  if ($('#list').classList.contains('open')) renderList(lastObjects);
  setTimeout(redraw, 0);
};
$('#b_panel').onclick = () => {
  $('#panel').classList.toggle('open');
  setTimeout(redraw, 0);
};

$('#f_conf').oninput = e => setConf(parseFloat(e.target.value));
$('#f_size').onchange = e => sendSize = parseInt(e.target.value, 10);
$('#f_lang').onchange = e => { lang = e.target.value; renderList(lastObjects); };

$('#f_backend').onchange = async e => {
  const kind = e.target.value;
  syncBackendUI();
  state('검출기 바꾸는 중…');
  try {
    const body = { kind };
    if (kind === 'world') body.classes = splitPrompt($('#f_prompt').value);
    const r = await fetch('/backend', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    info = j.info;
    $('#c_model').textContent = info.name + ' · ' + info.device;
    if (info.world) $('#f_prompt').value = info.classes.join(', ');
    state(running ? '실행 중' : '준비됨');
  } catch (err) { state('검출기 전환 실패: ' + err.message); }
};

const splitPrompt = s => s.split(',').map(x => x.trim()).filter(Boolean);

$('#b_prompt').onclick = async () => {
  const names = splitPrompt($('#f_prompt').value);
  if (!names.length){ $('#s_prompt').textContent = '하나 이상 적으십시오.'; return; }
  $('#s_prompt').textContent = '적용 중…';
  try {
    const r = await fetch('/classes', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ classes: names })
    });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    info = j.info;
    $('#s_prompt').textContent = j.classes.length + '종 적용됨';
  } catch (e) { $('#s_prompt').textContent = '실패: ' + e.message; }
};

/* 캔버스 크기를 바꾸면 내용이 지워진다. 그래서 레이아웃이 흔들릴 때마다
   (화면 회전, 패널 여닫기, 창 크기 변경) 마지막 결과를 다시 그려 준다.
   안 그러면 멈춘 상태에서 회전했을 때 상자만 사라진다. */
function redraw(){
  if (lastObjects.length) draw(lastObjects, lastSrc.w, lastSrc.h);
  else fitOverlay();
}
window.addEventListener('resize', redraw);
window.addEventListener('orientationchange', () => setTimeout(redraw, 250));
video.addEventListener('loadedmetadata', redraw);
loadConfig().then(() => state('시작을 누르십시오'));
</script>
</body>
</html>
